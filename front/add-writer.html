<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Writer - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Access Modal -->
    <div id="authBox" class="bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-sm w-full text-center space-y-4">
        <h2 class="text-xl font-bold">🔐 Security Pass</h2>
        <input type="password" id="adminPassInput" placeholder="Enter Password" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-sm focus:outline-none">
        <button onclick="verifyAccess()" class="w-full py-3 bg-indigo-600 font-bold rounded-xl text-sm">Verify</button>
        <p id="errorMsg" class="text-xs text-rose-500 hidden">Ghalat password!</p>
    </div>

    <!-- Form Box -->
    <div id="writerFormBox" class="hidden bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-md w-full space-y-4">
        <h2 class="text-lg font-bold text-indigo-400">✍️ Add New Writer</h2>
        <form onsubmit="submitNewWriter(event)" class="space-y-4">
            <input type="text" id="writerName" required placeholder="Writer Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none">
            <textarea id="writerBio" rows="3" placeholder="Bio / Description" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none"></textarea>
            <input type="url" id="writerImage" placeholder="Profile Image URL (Cloudinary)" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none">
            <button type="submit" class="w-full py-3 bg-emerald-600 font-bold rounded-xl text-sm">Save Writer</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000/api' 
            : 'https://noveltube-3.onrender.com/api';

        let adminPassword = '';

        function verifyAccess() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'mywifesaba') {
                adminPassword = pass;
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('writerFormBox').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        async function submitNewWriter(e) {
            e.preventDefault();
            const writerData = {
                name: document.getElementById('writerName').value,
                bio: document.getElementById('writerBio').value,
                image: document.getElementById('writerImage').value,
                password: adminPassword
            };

            try {
                const res = await fetch(`${API_BASE_URL}/writers`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(writerData)
                });

                if (res.ok) {
                    alert('Writer Database me save ho gaya hai! 🎉');
                    window.location.href = 'index.html';
                } else {
                    alert('Error: Writer add nahi ho saka.');
                }
            } catch (err) {
                alert('Server Error!');
            }
        }
    </script>
</body>
</html>
