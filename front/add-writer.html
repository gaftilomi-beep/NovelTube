<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Writer - Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Security Pass -->
    <div id="authBox" class="bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-sm w-full text-center space-y-4">
        <h2 class="text-xl font-bold">🔐 Security Pass</h2>
        <input type="password" id="adminPassInput" placeholder="Enter Password" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-center text-sm focus:outline-none">
        <button onclick="verifyAccess()" class="w-full py-3 bg-indigo-600 font-bold rounded-xl text-sm hover:bg-indigo-700 transition">Verify</button>
        <p id="errorMsg" class="text-xs text-rose-500 hidden">Ghalat password!</p>
    </div>

    <!-- Form Box -->
    <div id="writerFormBox" class="hidden bg-slate-800 p-8 rounded-3xl border border-slate-700 max-w-md w-full space-y-4">
        <h2 class="text-lg font-bold text-indigo-400">✍️ Add New Writer</h2>
        <form onsubmit="submitNewWriter(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Writer Name</label>
                <input type="text" id="writerName" required placeholder="Writer Name" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">Bio / Description</label>
                <textarea id="writerBio" rows="3" placeholder="Bio / Description" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none"></textarea>
            </div>

            <!-- Upload File From PC -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">Upload Profile Picture (PC File)</label>
                <input type="file" id="writerImageFile" accept="image/*" onchange="previewImage(event)" class="w-full text-xs text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 bg-slate-900 border border-slate-700 rounded-xl cursor-pointer">
            </div>

            <!-- Preview Area -->
            <div id="previewContainer" class="hidden flex items-center gap-3 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700">
                <img id="imgPreview" src="" alt="Preview" class="w-12 h-12 rounded-full object-cover border-2 border-indigo-500">
                <span class="text-xs text-slate-300 font-medium">Selected Photo Preview</span>
            </div>

            <!-- Image URL Backup -->
            <div>
                <label class="block text-xs text-slate-400 mb-1">Or Direct Image URL (Optional)</label>
                <input type="url" id="writerImageUrl" placeholder="https://..." class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl text-sm focus:outline-none">
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-emerald-600 font-bold rounded-xl text-sm hover:bg-emerald-700 transition">Save Writer</button>
        </form>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
            ? 'http://localhost:5000/api' 
            : 'https://noveltube-3.onrender.com/api';

        let adminPassword = '';

        function verifyAccess() {
            const pass = document.getElementById('adminPassInput').value;
            if (pass === 'mywifesaba') {
                adminPassword = pass;
                document.getElementById('authBox').classList.add('hidden');
                document.getElementById('writerFormBox').classList.remove('hidden');
            } else {
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        function previewImage(event) {
            const file = event.target.files[0];
            const previewContainer = document.getElementById('previewContainer');
            const imgPreview = document.getElementById('imgPreview');

            if (file) {
                imgPreview.src = URL.createObjectURL(file);
                previewContainer.classList.remove('hidden');
            } else {
                previewContainer.classList.add('hidden');
            }
        }

        async function submitNewWriter(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'Saving Writer... ⏳';
            submitBtn.disabled = true;

            const fileInput = document.getElementById('writerImageFile');
            const file = fileInput.files[0];
            const urlInput = document.getElementById('writerImageUrl').value;

            // FormData Payload
            const formData = new FormData();
            formData.append('name', document.getElementById('writerName').value);
            formData.append('bio', document.getElementById('writerBio').value);
            formData.append('password', adminPassword);

            if (file) {
                formData.append('photo', file); // Sending file from PC
            } else if (urlInput) {
                formData.append('photoUrl', urlInput);
            }

            try {
                const res = await fetch(`${API_BASE_URL}/writers`, {
                    method: 'POST',
                    body: formData
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    alert('Writer picture ke sath successfully save ho gaya! 🎉');
                    window.location.href = 'index.html';
                } else {
                    alert('Error: ' + (data.message || 'Writer save nahi ho saka.'));
                }
            } catch (err) {
                console.error(err);
                alert('Server Connection Error!');
            } finally {
                submitBtn.innerText = 'Save Writer';
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
