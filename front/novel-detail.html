<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Details - NovelTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @font-face {
            font-family: 'Jameel Noori Nastaleeq';
            src: url('https://cdn.jsdelivr.net/gh/Sajjad26/Jameel-Noori-Nastaleeq-Web@master/Jameel%20Noori%20Nastaleeq.woff2') format('woff2'),
                 url('https://cdn.jsdelivr.net/gh/subbanyusuf/jameel-noori-nastaleeq@master/Jameel%20Noori%20Nastaleeq.ttf') format('truetype');
            font-display: swap;
            font-weight: normal;
            font-style: normal;
        }

        .font-urdu {
            font-family: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', 'Urdu Typesetting', serif !important;
            line-height: 2.0 !important;
        }

        .smart-text {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
        }
    </style>
</head>

<!-- MONETAG AD SCRIPT -->
<script>(function(s){s.dataset.zone='11420936',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>

<body class="bg-slate-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto px-4 py-8">
        
        <div id="loading" class="text-center text-slate-500 font-medium py-20">
            Tafseelat load ho rahi hain... ⏳
        </div>

        <div id="novelContainer" class="hidden space-y-8">
            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-6 items-center md:items-start">
                <img id="novelCover" src="" alt="Cover" class="w-44 h-60 object-cover rounded-xl shadow-md border border-slate-100 flex-shrink-0">
                
                <div class="flex-1 text-center md:text-left space-y-3 w-full">
                    
                    <div class="flex flex-wrap items-center justify-center md:justify-start gap-2 w-full">
                        <h1 id="novelTitle" dir="auto" class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight smart-text"></h1>
                        <span id="novelStatus" class="px-2.5 py-1 text-xs font-bold rounded-full"></span>
                    </div>

                    <p class="text-sm font-semibold text-indigo-600">Written by: <span id="novelAuthor" class="text-slate-700"></span></p>
                    
                    <div class="flex items-center justify-center md:justify-start gap-4 text-xs font-semibold text-slate-400 py-1">
                        <span class="flex items-center gap-1">📅 <span id="dateDisplay" class="text-slate-600">--/--/----</span></span>
                    </div>

                    <div class="pt-2">
                        <h3 id="aboutHeadingText" class="text-xs font-bold text-slate-400 uppercase tracking-wider text-left">About Novel:</h3>
                        <p id="novelDescription" dir="auto" class="smart-text text-base text-slate-800 mt-2 leading-relaxed"></p>
                    </div>

                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                
                <div id="singleNovelSection" class="hidden text-center py-6 space-y-4">
                    <h2 id="readingOptionsHeading" class="text-lg font-bold text-slate-800">📖 Full Novel Reading Options</h2>
                    <p id="readingOptionsSub" class="text-xs text-slate-500">Yeh novel mukammal aik hi file mein available hai.</p>
                    <div class="flex flex-wrap justify-center gap-4">
                        <a id="readOnlineBtn" href="" target="_blank" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-sm transition">Read Online</a>
                        <a id="downloadBtn" href="" target="_blank" class="px-6 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm rounded-xl shadow-sm transition">Download Full PDF</a>
                    </div>
                </div>

                <div id="chaptersSection" class="hidden space-y-4">
                    <h2 id="listSectionHeading" class="text-lg font-bold text-slate-800 border-b border-slate-100 pb-2">📑 Episodes / Chapters List</h2>
                    <div id="chaptersList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                </div>

            </div>

        </div>
    </div>

  <script>
    const API_BASE_URL = 'https://noveltube-2.onrender.com/api';

    function isUrduText(text) {
        if(!text) return false;
        return /[\u0600-\u06FF]/.test(text);
    }

    function getDownloadPageUrl(pdfUrl, rawTitle) {
        const cleanTitle = rawTitle ? encodeURIComponent(rawTitle.trim()) : 'NovelTube_PDF';
        return `download.html?file=${encodeURIComponent(pdfUrl)}&title=${cleanTitle}`;
    }

    async function triggerGenuineView(id) {
        const storageKey = `view_cooldown_${id}`;
        const lastViewTime = localStorage.getItem(storageKey);
        const now = Date.now();

        if (!lastViewTime || (now - parseInt(lastViewTime)) > 15 * 60 * 1000) {
            try {
                await fetch(`${API_BASE_URL}/novels/${id}/view`, { method: 'POST' });
                localStorage.setItem(storageKey, now.toString());
            } catch(err) {
                console.log("Analytics view registration fail.");
            }
        }
    }

    async function fetchNovelDetails() {
        const urlParams = new URLSearchParams(window.location.search);
        const novelId = urlParams.get('id');

        if (!novelId) {
            document.getElementById('loading').innerHTML = "❌ ID nahi mili URL mein!";
            return;
        }

        await triggerGenuineView(novelId);

        try {
            const response = await fetch(`${API_BASE_URL}/novels/${novelId}`);
            if (!response.ok) throw new Error('Content nahi mila');
            
            const item = await response.json();

            const itemCategory = item.category ? item.category.toLowerCase() : '';
            const isArticle = (item.contentType && item.contentType.toLowerCase().trim() === 'article') || itemCategory.includes('article');
            
            if (isArticle) {
                document.getElementById('aboutHeadingText').innerText = "About Article:";
                document.getElementById('readingOptionsHeading').innerText = "📰 Full Article Reading Options";
                document.getElementById('readingOptionsSub').classList.add('hidden');
                document.getElementById('downloadBtn').innerText = "Download Article PDF";
                document.getElementById('listSectionHeading').innerText = "📑 Article Parts / Sections List";
            } else {
                document.getElementById('aboutHeadingText').innerText = "About Novel:";
                document.getElementById('readingOptionsHeading').innerText = "📖 Full Novel Reading Options";
                document.getElementById('readingOptionsSub').classList.remove('hidden');
                document.getElementById('readingOptionsSub').innerText = "Yeh novel mukammal aik hi file mein available hai.";
                document.getElementById('downloadBtn').innerText = "Download Full PDF";
                document.getElementById('listSectionHeading').innerText = "📑 Episodes / Chapters List";
            }
            
            if(item.createdAt) {
                const cleanDate = new Date(item.createdAt).toLocaleDateString('en-GB');
                document.getElementById('dateDisplay').innerText = cleanDate;
            }

            document.getElementById('novelCover').src = item.coverImage;
            
            const titleEl = document.getElementById('novelTitle');
            titleEl.innerText = item.title;
            if(isUrduText(item.title)) {
                titleEl.classList.add('font-urdu');
                titleEl.classList.remove('smart-text');
            } else {
                titleEl.classList.add('smart-text');
                titleEl.classList.remove('font-urdu');
            }

            document.getElementById('novelAuthor').innerText = item.author;
            
            const descEl = document.getElementById('novelDescription');
            descEl.innerText = item.description;
            if(isUrduText(item.description)) {
                descEl.classList.add('font-urdu', 'text-right');
                descEl.classList.remove('smart-text', 'text-left');
            } else {
                descEl.classList.add('smart-text', 'text-left');
                descEl.classList.remove('font-urdu', 'text-right');
            }
            
            const statusBadge = document.getElementById('novelStatus');
            statusBadge.innerText = item.status;
            if(item.status === 'Ongoing') {
                statusBadge.className = "px-2.5 py-1 text-xs font-bold rounded-full bg-amber-100 text-amber-800";
            } else {
                statusBadge.className = "px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-100 text-emerald-800";
            }

            // Combine Novel Title + Author for Filenames
            const baseFileName = item.author ? `${item.title} by ${item.author}` : item.title;

            const singleSection = document.getElementById('singleNovelSection');
            const chaptersSection = document.getElementById('chaptersSection');

            if (item && (item.hasChapters === true || (item.chapters && item.chapters.length > 0))) {
                singleSection.classList.add('hidden');
                chaptersSection.classList.remove('hidden');

                const listContainer = document.getElementById('chaptersList');
                listContainer.innerHTML = ""; 

                item.chapters?.forEach((ch) => {
                    const hasChapterPdf = ch.chapterPdf && ch.chapterPdf.trim() !== "" && ch.chapterPdf !== "#";
                    const readUrl = hasChapterPdf ? `https://docs.google.com/gview?url=${encodeURIComponent(ch.chapterPdf)}` : '#';
                    
                    // Creates title like: "Mavrah by Qurat Episode 1"
                    const fullChapterTitle = `${baseFileName} ${ch.chapterTitle}`;
                    const downloadLandPageUrl = hasChapterPdf ? getDownloadPageUrl(ch.chapterPdf, fullChapterTitle) : '#';
                    
                    const clickHandler = hasChapterPdf ? '' : `onclick="event.preventDefault(); alert('⚠️ Is episode ka PDF URL database mein mojud nahi hai!');"`;
                    
                    const isUrduChapter = isUrduText(ch.chapterTitle);
                    const fontClass = isUrduChapter ? 'font-urdu' : 'smart-text';

                    listContainer.innerHTML += `
                        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 bg-slate-50 border border-slate-200 rounded-xl gap-3 hover:border-indigo-200 transition duration-200">
                            <span dir="auto" class="${fontClass} text-base font-semibold text-slate-800 break-words w-full sm:w-auto">
                                ${ch.chapterTitle}
                            </span>
                            <div class="flex items-center gap-2 w-full sm:w-auto justify-end flex-shrink-0 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-200">
                                <a href="${readUrl}" ${clickHandler} target="_blank" class="flex-1 sm:flex-initial text-center px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 font-bold text-xs rounded-lg transition">
                                    Read 📖
                                </a>
                                <a href="${downloadLandPageUrl}" ${clickHandler} target="_blank" class="flex-1 sm:flex-initial text-center px-4 py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-lg transition shadow-xs">
                                    Download 📥
                                </a>
                            </div>
                        </div>
                    `;
                });
            } else {
                chaptersSection.classList.add('hidden');
                singleSection.classList.remove('hidden');

                const hasMainPdf = item.mainPdf && item.mainPdf.trim() !== "" && item.mainPdf !== "#";

                if (hasMainPdf) {
                    const singleReadUrl = `https://docs.google.com/gview?url=${encodeURIComponent(item.mainPdf)}`;
                    // Creates title like: "Muhal by Hamza Yousafzai"
                    const mainDownloadPageUrl = getDownloadPageUrl(item.mainPdf, baseFileName);

                    document.getElementById('readOnlineBtn').href = singleReadUrl;
                    document.getElementById('downloadBtn').href = mainDownloadPageUrl;
                } else {
                    const missingLinkAlert = (e) => {
                        e.preventDefault();
                        alert("⚠️ Is novel/article ka main PDF URL database mein mojud nahi hai!");
                    };
                    document.getElementById('readOnlineBtn').href = "#";
                    document.getElementById('downloadBtn').href = "#";
                    document.getElementById('readOnlineBtn').onclick = missingLinkAlert;
                    document.getElementById('downloadBtn').onclick = missingLinkAlert;
                }
            }

            document.getElementById('loading').classList.add('hidden');
            document.getElementById('novelContainer').classList.remove('hidden');

        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = "❌ Data load karne mein masla aaya ya backend band hai.";
        }
    }

    window.onload = fetchNovelDetails;
</script>
</body>
</html>
